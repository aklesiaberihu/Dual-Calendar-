services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dualcal
      POSTGRES_PASSWORD: dualcal
      POSTGRES_DB: dualcal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dualcal -d dualcal"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://dualcal:dualcal@db:5432/dualcal
      SECRET_KEY: change-this-secret
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USERNAME: dualcal.reminders@gmail.com
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_FROM: dualcal.reminders@gmail.com
      SMTP_USE_TLS: "true"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "http://localhost:8000/google/callback"
      GOOGLE_LOGIN_REDIRECT_URI: "http://localhost:8000/auth/google/callback"
      FRONTEND_URL: "http://localhost:5173"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  frontend_node_modules: